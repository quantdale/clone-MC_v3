name: CI

on:
  push:
    branches: [main]
  pull_request:

# Deterministic concurrency: serialize per ref, never cancel in-progress main builds
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-jammy
    # The full required gate (validate-state, typecheck, lint, build, the 3574-test
    # unit suite, coverage thresholds, both dependency audits, a Playwright browser
    # install, and the 31-test E2E suite) must complete without weakening any test,
    # threshold, or audit requirement. Runs #329 and #331 were cancelled at their
    # job timeouts (60m and 120m) because `npx playwright install --with-deps
    # chromium` vendors the Chromium apt dependencies on the runner and hangs on a
    # cold cache. The mcr.microsoft.com/playwright container image already bundles
    # Chromium and its system libraries (matching the pinned Playwright 1.62.1), so
    # no runner apt step is needed and the browser is available via the existing
    # cache/install step. 45 minutes gives the required gate headroom.
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Validate repository state
        run: npm run validate-state

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Coverage (no-regression thresholds)
        run: npm run test:coverage

      - name: Production dependency audit (block high/critical)
        run: npm audit --omit=dev

      - name: Full dependency audit (block high/critical)
        run: npm audit

      # In the Playwright container the browser and its system deps are preinstalled;
      # a plain install is a fast cacheable idempotent check.
      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: E2E tests
        run: xvfb-run -a npm run test:e2e

      - name: Upload coverage report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
