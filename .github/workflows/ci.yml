name: CI

on:
  push:
    branches: [main]
  pull_request:

# Deterministic concurrency: serialize per ref, never cancel in-flight
# main builds
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Static + unit gate: validate-state, typecheck, lint, build, the full unit
  # suite, coverage thresholds, SEC-001 bundle assertion, and both dependency
  # audits. Runs in PARALLEL with the E2E job — no requirement is weakened;
  # splitting simply gives each heavy half its own wall-clock budget after the
  # deep-engine wave grew both halves past a single 60-minute job (run on
  # a83a810 passed every step except E2E, cancelled at the job timeout).
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      # persist-credentials: false keeps the job token out of .git/config, so
      # it can never be captured by an uploaded artifact (the e2e job uploads
      # test-results/ on failure). zizmor artipacked; no git push happens here.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate repository state
        run: npm run validate-state

      # Change 301: the three fast repository-invariant guards. They previously
      # shipped but were reachable only by typing a file path, so the invariants
      # every change's verification.md claims were enforced by memory alone.
      - name: Verify dependency tree matches the lockfile
        run: npm run verify:deps

      - name: File-audit manifest integrity
        run: npm run verify:file-audit

      - name: Unreferenced-source guard
        run: npm run verify:orphans

      - name: Add-on security preflight
        run: npm run verify:mcp

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # SEC-001 (249 hardening): the plain release bundle must never inherit the
      # E2E-only window.__voxelGame hook. Runs against the clean build artifact.
      - name: Release bundle assertion (no E2E hook)
        run: node scripts/check-release-bundle.mjs

      - name: Unit tests
        run: npm test

      - name: Coverage (no-regression thresholds)
        run: npm run test:coverage

      - name: Production dependency audit (block high/critical)
        run: npm audit --omit=dev

      - name: Full dependency audit (block high/critical)
        # Matches the step title and production policy: fail on high/critical
        # only. Moderate dev-only findings (e.g. vitest mocker chain, fixed
        # upstream in breaking vitest >= 4.1.11) are tracked, not gate-blocking.
        run: npm audit --audit-level=high

      - name: Upload coverage report on failure
        if: failure()
        # upload-artifact v4, pinned to an immutable commit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  # Browser gate: Playwright Chromium install (cold-cache apt cost, cached
  # afterwards) plus the 46-test E2E suite under xvfb for headless WebGL. The
  # persistence durability suite alone can take ~15 minutes of real IndexedDB
  # commits on slow disks and the visual/memory matrices are serial by design
  # (workers: 1), so this job owns its own generous budget instead of competing
  # with the unit/coverage half of the gate.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      # persist-credentials: false keeps the job token out of .git/config, so
      # it can never be captured by an uploaded artifact (the e2e job uploads
      # test-results/ on failure). zizmor artipacked; no git push happens here.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Host runner: install Chromium plus its system deps (cached via
      # actions/cache).
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Change 300: refuse to spend 40+ minutes on the browser gate when the
      # committed golden set predates a change to a captured surface
      # (index.html / src/styles.css / src/rendering/**). Line-ending-only
      # commits are skipped. A reviewer who has genuinely reviewed the new
      # surface may acknowledge one exact commit with
      # VISUAL_GOLDENS_ACKNOWLEDGED=<40-hex sha>.
      - name: Visual golden staleness
        run: node scripts/check-visual-goldens.mjs

      # Playwright's webServer rebuilds with VITE_E2E=true before booting the
      # suite (the E2E-only window.__voxelGame hook is legitimately present for
      # the specs; the plain-bundle assertion lives in the `gate` job).
      - name: E2E tests
        run: xvfb-run -a npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        # upload-artifact v4, pinned to an immutable commit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # Change 302: the normative multiplayer budgets REQ-P3 (sustainedTps >= 200)
  # and REQ-P7 (elapsedMs <= 6000) are guarded by
  #   it.skipIf(process.env.MC_CANONICAL !== '1')
  # so the shared `npm test` suite never runs the contention-sensitive
  # measurement. Before this job NOTHING set MC_CANONICAL outside OpenSpec
  # prose,
  # which meant the budget could regress silently with every gate green.
  # Dedicated, single-worker, and isolated from the other jobs' CPU load.
  perf-multiplayer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # persist-credentials: false keeps the job token out of .git/config.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify dependency tree matches the lockfile
        run: npm run verify:deps

      # The runner asserts exactly ONE test passed, so a renamed test or a
      # zero-match filter fails here instead of passing vacuously.
      - name: Canonical multiplayer throughput and wall-clock budget
        run: npm run test:perf:multiplayer
