name: CI

on:
  push:
    branches: [main]
  pull_request:

# Deterministic concurrency: serialize per ref, never cancel in-progress main builds
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    # The full required gate (validate-state, typecheck, lint, build, the 3574-test
    # unit suite, coverage thresholds, both dependency audits, a cold Playwright
    # browser install with --with-deps, and the 31-test E2E suite) needs well over
    # 30 minutes on a cold cache; the previous 30-minute limit killed the job during
    # the Playwright install step. 60 minutes gives the required gate headroom to
    # complete without weakening any test, threshold, or audit requirement.
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Validate repository state
        run: npm run validate-state

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Coverage (no-regression thresholds)
        run: npm run test:coverage

      - name: Production dependency audit (block high/critical)
        run: npm audit --omit=dev

      - name: Full dependency audit (block high/critical)
        run: npm audit

      # Playwright webServer builds and serves the production artifact (see playwright.config.ts).
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload coverage report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
