name: CI

on:
  push:
    branches: [main]
  pull_request:

# Deterministic concurrency: serialize per ref, never cancel in-progress main builds
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    # The full required gate (validate-state, typecheck, lint, build, the 3574-test
    # unit suite, coverage thresholds, both dependency audits, a cold Playwright
    # browser install, and the 31-test E2E suite) must complete without weakening any
    # test, threshold, or audit requirement. The previous run was cancelled at the
    # 60-minute limit because `npx playwright install --with-deps chromium` hung in
    # the apt dependency step (~58 min, step 14 never completed). GitHub's ubuntu-latest
    # runners already provide the chromium system libraries, so the install is now a
    # fast, cacheable browser download (no --with-deps). 90 minutes gives headroom for
    # a cold-cache download plus the E2E suite.
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Validate repository state
        run: npm run validate-state

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Coverage (no-regression thresholds)
        run: npm run test:coverage

      - name: Production dependency audit (block high/critical)
        run: npm audit --omit=dev

      - name: Full dependency audit (block high/critical)
        run: npm audit

      # Playwright webServer builds and serves the production artifact (see playwright.config.ts).
      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload coverage report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
